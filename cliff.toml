# git-cliff configuration file.
# https://git-cliff.com/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to this project are documented in this file.\n
Generated by [git-cliff](https://github.com/orhun/git-cliff).\n
"""
body = """
{% if version %}\
    ## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/ralsina/hansa/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
tag_pattern = "v[0-9].*"

# Keep only the subject line of each commit message
[[git.commit_preprocessors]]
pattern = '(?s)\n.*'
replace = ""

[[git.commit_parsers]]
message = "^Bump version"
skip = true

[[git.commit_parsers]]
message = "^chore\\(release\\)"
skip = true

[[git.commit_parsers]]
message = "^feat(\\(.+\\))?!?:"
group = "Features"

[[git.commit_parsers]]
message = "^fix(\\(.+\\))?!?:"
group = "Bug Fixes"

[[git.commit_parsers]]
message = "^perf(\\(.+\\))?!?:"
group = "Performance"

[[git.commit_parsers]]
message = "^doc(\\(.+\\))?!?:"
group = "Documentation"

[[git.commit_parsers]]
message = "^style(\\(.+\\))?!?:"
group = "Styling"

[[git.commit_parsers]]
message = "^refactor(\\(.+\\))?!?:"
group = "Refactoring"

[[git.commit_parsers]]
message = "^test(\\(.+\\))?!?:"
group = "Testing"

[[git.commit_parsers]]
message = ".*"
group = "Miscellaneous"
